<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document   DOM</title>


    <!-- METTO LO STILE = CSS IN PAGINA -->
    <style>



/* SFONDO MINIMO PER PAGINA */
        body {

            margin: 0 ; 
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(10deg, orange, yellow);
            color: black;
            padding: 20px;
      
        }

    
                
        /* TITOLO H1 */
    h1{
text-align: center;
        font-weight: 800;
       margin: 0 0 12px;
        display: inherit;
        border: 2px solid black;
        border-radius: 8px;
        background-color: antiquewhite;
        
    }



/* CONTENITORE PARAGRAFI */

.bottoni {
    margin: 12px 0;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}




/* STILE  .bottoni */

button {
    padding: 10px 12px;
  display: flex;
  background-color: aqua;
 border-radius: 15px;
  border: 3px double red;
   
}

button:hover{
   
    background-color: black;
    color:white;
}

    /* PARAGRAFI */

    .paragrafo {
        text-align: center;
        display: flex;
       color: black;
       border: 2px outset red;
       background-color: wheat;
        padding: 12px;
        margin: 10px;
        border: 2px dotted red;

    }




    </style>
</head>
<body>
    
<!-- TITOLO -->


    <h1>Selfwork DOM 1</h1>
   
<!-- / crea una pagina HTML con 3 paragrafi e 3 bottoni. -->

    <div class="bottoni">
        <button id="btn-colore">Cambia colori</button>
        <button id="btn-grassetto">Grassetto ON/OFF</button>
        <button id="btn-visibilita">Nascondi / Mostra</button>
    </div>

    <p id="p1" class="paragrafo">Paragrafo 1: clicco e cambia il colore in modo casuale.</p>
    <p id="p2" class="paragrafo">Paragrafo 2: posso mettere tutto in grassetto.</p>
    <p id="p3" class="paragrafo">Paragrafo 3: posso farli scomparire e ricomparire.</p>


<script>

    // AVVIO DEL MIO JS NEL LAVORO -> Prendo elementi e li Trasformo; 
    
    //JS PER PARAGRAFI
    const p1 = document.getElementById("p1");
    const p2 = document.getElementById("p2");
     const p3 = document.getElementById("p3");
     
     
     //JS PER BOTTONI
     
     const btnColore = document.getElementById("btn-colore")
      const btnGrassetto = document.getElementById("btn-grassetto")
     const btnVisibilità = document.getElementById("btn-visibilita")


     //Creo Variabili per renderli Visione

     let paragrafiVisibili = true;
     let grassettoAttivo = false;

// AGGIUNGO LA FUNZIONE PER EFFETTIVITA' SULL'ANIMAZIONE JS ALLA PaginA:
let coloriA =true;

    function cambiaColoreParagrafi() {

        if (coloriA === true) {
            p1.style.color = "green";
            p2.style.color = "blue";
            p3.style.color = "gray";
            coloriA = false;

        }else{


            p1.style.color = "red";
            p2.style.color = "orange";
            p3.style.color = "black";

            
            
            coloriA = true;
        }
       
    }


 function toggleGrassetto() {
   
    grassettoAttivo = !grassettoAttivo;


if ( grassettoAttivo === true ) {
    p1.style.fontWeight ="800";
    p2.style.fontWeight = "800";
    p3.style.fontWeight = "800";


} else {
    p1.style.fontWeight = "400";
    p2.style.fontWeight ="400";
    p3.style.fontWeight ="400";
  

}
}


//FUNZIONE VISIBILITA'



function toggleVisibilita() {
    

 paragrafiVisibili = !paragrafiVisibili;

    if (paragrafiVisibili === true) {
        p1.style.display = "block";
        p2.style.display = "block";
        p3.style.display = "block";
     
    }else{

        p1.style.display = "none";
          p2.style.display = "none";
            p3.style.display = "none";
           
    }
}


// addEventListener per le funzioni. invocazioni. Eventi;

btnColore.addEventListener("click", cambiaColoreParagrafi);
btnGrassetto.addEventListener("click", toggleGrassetto);
btnVisibilità.addEventListener("click", toggleVisibilita);




</script>

</body>
</html>
